# Half-hourly refresh of the coding-profile snapshot.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan
# rejects any cron expression that would fire more than once a day — a
# "*/30 * * * *" entry fails at deploy time, not at runtime. GitHub
# Actions has no such limit and is free, so it drives the real cadence
# and the daily Vercel cron stays as a backstop.
#
# Requires two repository secrets:
#   SITE_URL     https://your-domain
#   CRON_SECRET  the same value set in the Vercel project's env vars
name: Refresh stats

on:
  schedule:
    # :07 and :37 rather than :00 and :30. GitHub documents that the
    # schedule event "can be delayed during periods of high load" and
    # names the start of every hour as one — and a */30 cron fires at
    # exactly the two minutes every other cron on the platform also
    # fires, so free-tier runners queue behind them. Observed: a run due
    # at 21:00 UTC started at 21:26. Offsetting moves it out of that
    # stampede. It reduces the delay; GitHub gives no timing guarantee,
    # so occasional lateness is still expected and harmless here.
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh
        run: |
          code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/revalidate")
          cat response.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::refresh returned HTTP $code"
            exit 1
          fi
